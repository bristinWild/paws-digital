<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173c32" />
    <title>PAWS · Wild Ventures</title>
    <link
      rel="icon"
      type="image/webp"
      href="/assets/Tokens/Active%20Player/Token%20Active%20Player.webp"
    />
    <link rel="stylesheet" href="/style.css" />
    <script src="/vendor/three.min.js"></script>
    <script type="module" src="/build/app.js"></script>
  </head>
  <body>
    <div id="stage" aria-label="PAWS table"></div>
    <div id="weather" aria-hidden="true"></div>
    <div id="spot" aria-hidden="true"></div>
    <div id="app"></div>
    <div id="spot-rings" aria-hidden="true"></div>
    <div id="trail" role="img" aria-label="Ranger trail"></div>
    <aside id="inspect" class="inspect" aria-live="polite"></aside>
    <div id="banner" aria-hidden="true"></div>
    <div id="scene" role="dialog" aria-modal="true" aria-live="polite"></div>
    <div id="fx" aria-hidden="true"></div>
    <div id="pointer" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"></dialog>
  </body>
</html>
